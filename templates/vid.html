<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Checker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

{% include 'navbar.html' %}

<section class="hero">
    <div class="container">

        <div class="hero-content">
              <h1>Detect AI-Generated Videos with <span class="gradient-text">AI Analysis</span></h1>
              <p class="hero-subtitle">
                   Upload a video and detect whether it contains AI-generated content.
              </p>
        </div>


        <div class="hero-visual">
            <div class="detection-demo">

                <div class="demo-header">
                    <div class="demo-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="demo-title">Video Detection Result</span>
                </div>

                <div class="demo-content">

                   <form onsubmit="event.preventDefault(); uploadVideo();">
 
                     <div class="upload-area" onclick="document.getElementById('videoInput').click()">

                        <input 
                            type="file" 
                            id="videoInput"
                            accept="video/*"
                            required
                            style="display:none;"
                        >
                        <p id="fileName"></p>

                        <p class="upload-text" id="uploadText">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg><br>
                                Drop your Video here or <span>browse</span>
                            </p>

                        </div>

                        <br>

                        <button type="submit" class="btn btn-primary btn-lg" id="detectButton" style="display:block; margin:20px auto;">
                            Analyze Video
                        </button>

                    </form>

                    <!-- RESULT -->
               <div id="resultBox" class="result-card" style="display:none;">

               <div class="result-verdict">
                    <div class="verdict-icon ai">🎬</div>

                    <div class="verdict-text">
                        <span class="verdict-label">Video Analysis</span>
                        <span class="verdict-value" id="verdict"></span>
                        <span class="verdict-confidence" id="details"></span>
                    </div>
                    </div>
                </div>
                       
                </div>
            </div>
        </div>

    </div>
</section>

{% include 'footer.html' %}

<script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
